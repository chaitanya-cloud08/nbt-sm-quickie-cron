name: NBT Quickie Daily Quiz

on:
  schedule:
    # 09:00 IST == 03:30 UTC, every day.
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      debug_feed:
        description: "Log raw feed field names when a URL can't be found (troubleshooting)"
        type: boolean
        default: false

jobs:
  generate-quiz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --production

      - name: Generate quiz and append to sheet
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          SHEET_NAME: ${{ secrets.SHEET_NAME }}
          QUICKIE_DEBUG_FEED: ${{ inputs.debug_feed && '1' || '' }}
        run: npm start
