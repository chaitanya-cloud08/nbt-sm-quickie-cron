name: Quickie of the Day

on:
  schedule:
    # 15:00 IST == 09:30 UTC, every day.
    - cron: "30 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate-quickie:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write Google service account credentials
        run: echo "$GOOGLE_SERVICE_ACCOUNT_JSON" > /tmp/google-creds.json
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

      - name: Run quickie_daily_sheet.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GOOGLE_SHEETS_CREDS_PATH: /tmp/google-creds.json
          GOOGLE_SHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_SHEET_TAB_NAME: ${{ secrets.QUICKIE_SHEET_TAB_NAME }}
        run: python quickie_daily_sheet.py

      # used_stories.json is how the script avoids repeating a story; since
      # each run gets a fresh checkout, persist its updates back to the repo.
      - name: Persist used_stories.json
        run: |
          if ! git diff --quiet -- used_stories.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add used_stories.json
            git commit -m "Update used_stories.json [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
